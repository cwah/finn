<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f4ec" />
  <title>Scrapbook</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/cards.css" />
  <link rel="stylesheet" href="css/compose.css" />
  <link rel="stylesheet" href="css/scrubber.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/lightbox.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1 class="app-title" id="babyName">Scrapbook</h1>
      <p class="app-subtitle" id="babyAge"></p>
    </div>
    <button id="signOutBtn" class="app-signout" type="button" hidden>Sign out</button>
  </header>

  <main id="timeline" class="timeline" aria-live="polite"></main>

  <!-- Infinite-scroll sentinel observed by IntersectionObserver -->
  <div id="sentinel" class="sentinel" aria-hidden="true"></div>

  <!-- Right-edge date scrubber. Hidden from assistive tech: it is a shortcut for
       scrolling, and the timeline it duplicates is already in the reading order. -->
  <div id="scrubber" class="scrubber" aria-hidden="true">
    <div class="scrubber-ticks"></div>
    <div class="scrubber-thumb"></div>
    <div class="scrubber-bubble"></div>
  </div>

  <nav class="bottom-tray" aria-label="Primary">
    <button id="composeBtn" type="button" class="tray-capture" aria-label="Add a memory">
      <span class="tray-capture-icon" aria-hidden="true">+</span>
    </button>
  </nav>

  <!-- Compose sheet: the only place a post is authored. Note there is no layout
       control here — the engine infers layout from whatever is attached. -->
  <dialog id="compose" class="compose" aria-label="New memory">
    <form id="composeForm" class="compose-form">
      <h2 id="composeTitle" class="compose-title">New memory</h2>

      <div id="composePhotos" class="compose-photos" hidden></div>

      <!-- Photos are optional content inside the one flow, not a separate entry point.
           The label wraps the input so the native camera/picker opens on tap. -->
      <label class="compose-add-photos">
        <input id="capture" type="file" accept="image/*" capture="environment" multiple hidden />
        <span class="compose-add-icon" aria-hidden="true">+</span>
        <span id="composeAddLabel">Add photos</span>
      </label>

      <label class="compose-field">
        <span class="compose-label">Caption</span>
        <textarea id="composeCaption" rows="3" placeholder="What happened?"></textarea>
      </label>

      <label class="compose-field">
        <span class="compose-label">When did this happen?</span>
        <input id="composeDate" type="date" />
      </label>

      <label class="compose-toggle">
        <input id="composeMilestone" type="checkbox" />
        <span>Mark as a milestone</span>
      </label>
      <input id="composeMilestoneTitle" class="compose-milestone-title" type="text"
             placeholder="Milestone name, e.g. First steps" hidden />

      <p id="composeError" class="signin-error" role="alert" hidden></p>

      <div class="compose-actions">
        <button id="composeCancel" type="button" class="btn btn--ghost">Cancel</button>
        <button id="composeSave" type="submit" class="btn btn--primary">Save</button>
      </div>

      <!-- Only shown when editing. Deliberately quiet and last. -->
      <button id="composeDelete" type="button" class="compose-delete" hidden>
        Delete this memory
      </button>
    </form>
  </dialog>

  <!-- Reframe one photo. Opened by tapping a thumbnail in the compose sheet.
       The preview is square because the square grid cell is what actually crops. -->
  <dialog id="photoEditor" class="editor" aria-label="Photo framing">
    <div class="editor-body">
      <div class="editor-modes" role="tablist">
        <button type="button" data-mode="crop">Crop</button>
        <button type="button" data-mode="focus">Focus</button>
      </div>

      <p class="editor-hint"></p>

      <!-- Crop: the whole photo, with a rectangle over it -->
      <div class="editor-crop">
        <img class="editor-crop-img" alt="" />
        <div class="editor-rect">
          <span class="editor-handle" data-handle="nw"></span>
          <span class="editor-handle" data-handle="ne"></span>
          <span class="editor-handle" data-handle="sw"></span>
          <span class="editor-handle" data-handle="se"></span>
        </div>
      </div>
      <div class="editor-presets"></div>

      <!-- Focus: only the cropped result, in the square a grid cell would impose -->
      <div class="editor-focus" hidden>
        <div class="editor-stage">
          <img class="editor-img" alt="" />
          <span class="editor-dot" aria-hidden="true"></span>
        </div>
      </div>

      <button type="button" class="btn btn--ghost editor-main">Make main photo</button>
      <button type="button" class="btn btn--primary editor-done">Done</button>
    </div>
  </dialog>

  <!-- The full-size photo viewer builds its own markup — see js/lightbox.js -->

  <!-- Sign-in gate. Hidden entirely when the data source has no accounts (mock). -->
  <div id="signin" class="signin" hidden>
    <form id="signinForm" class="signin-card">
      <h2 class="signin-title">Scrapbook</h2>
      <p class="signin-hint">Sign in to see and add memories.</p>

      <label class="compose-field">
        <span class="compose-label">Email</span>
        <input id="signinEmail" type="email" autocomplete="username"
               autocapitalize="none" spellcheck="false" required />
      </label>

      <label class="compose-field">
        <span class="compose-label">Password</span>
        <input id="signinPassword" type="password" autocomplete="current-password" required />
      </label>

      <p id="signinError" class="signin-error" role="alert" hidden></p>

      <button id="signinSubmit" type="submit" class="btn btn--primary">Sign in</button>
    </form>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
