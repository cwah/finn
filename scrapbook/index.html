<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f4ec" />
  <!-- Static, and never touched afterwards. Matching the manifest name means the tab, the
       home-screen icon and the share sheet all say the same word, and nothing can change
       it mid-load — which is what made the title visibly switch before. -->
  <title>Finnbook</title>

  <!-- The icon is flattened onto the page's own sage rather than left transparent: iOS
       composites a transparent apple-touch-icon onto BLACK, which would put a black
       square on the home screen of a pale, quiet app. -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/cards.css" />
  <link rel="stylesheet" href="css/compose.css" />
  <link rel="stylesheet" href="css/scrubber.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/lightbox.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <!-- The app's name, not the baby's, and written here rather than filled in later:
           set from config it flickered on load exactly as the tab title did. -->
      <h1 class="app-title">Finnbook</h1>
      <p class="app-subtitle" id="babyAge"></p>
    </div>
    <div class="app-account">
      <!-- Opt-IN, per DEVICE. Off until someone asks: a browser only grants notification
           permission once, and a page that prompts on load is a page people refuse.
           aria-pressed rather than a checkbox — it is an action with a state. The label is
           visually hidden on narrow screens, where the bell has to speak for itself. -->
      <button id="notifyBtn" class="app-notify" type="button" hidden aria-pressed="false">
        <svg class="app-bell" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path class="bell-body"
                d="M8 1.8a3.6 3.6 0 0 0-3.6 3.6c0 2.4-.7 3.6-1.4 4.3a.5.5 0 0 0 .35.85h9.3a.5.5 0 0 0 .35-.85c-.7-.7-1.4-1.9-1.4-4.3A3.6 3.6 0 0 0 8 1.8z"/>
          <path class="bell-clapper" d="M6.5 12.6a1.6 1.6 0 0 0 3 0"/>
          <path class="bell-slash" d="M2.6 2.6l10.8 10.8"/>
        </svg>
        <span id="notifyLabel" class="app-notify-label">Notifications off</span>
      </button>
      <button id="signOutBtn" class="app-signout" type="button" hidden>Sign out</button>
    </div>
  </header>

  <!-- Why the bell would not turn on. The bell's own label is screen-reader only, so a
       blocked permission had no way to reach a sighted phone user at all: the bell simply
       did nothing. role="status" so it is announced when it appears. -->
  <p id="notifyNote" class="app-notify-note" role="status" hidden></p>

  <main id="timeline" class="timeline" aria-live="polite"></main>

  <!-- Infinite-scroll sentinel observed by IntersectionObserver -->
  <div id="sentinel" class="sentinel" aria-hidden="true"></div>

  <!-- Right-edge date scrubber. Hidden from assistive tech: it is a shortcut for
       scrolling, and the timeline it duplicates is already in the reading order. -->
  <div id="scrubber" class="scrubber" aria-hidden="true">
    <!-- The only part that takes touches. The strip is 60px wide so month labels have
         somewhere to sit, but everything grabbable — rail, dots, thumb — is within 20px
         of the edge, and the other 40 were swallowing taps meant for the card beneath. -->
    <div class="scrubber-grab"></div>
    <div class="scrubber-ticks"></div>
    <div class="scrubber-thumb"></div>
    <div class="scrubber-bubble"></div>
  </div>

  <nav class="bottom-tray" aria-label="Primary">
    <button id="composeBtn" type="button" class="tray-capture" aria-label="Add a memory">
      <span class="tray-capture-icon" aria-hidden="true">+</span>
    </button>
  </nav>

  <!-- Compose sheet: the only place a post is authored. Note there is no layout
       control here — the engine infers layout from whatever is attached. -->
  <dialog id="compose" class="compose" aria-label="New memory">
    <form id="composeForm" class="compose-form">
      <h2 id="composeTitle" class="compose-title">New memory</h2>

      <div id="composePhotos" class="compose-photos" hidden></div>

      <!-- Photos are optional content inside the one flow, not a separate entry point.
           The label wraps the input so the native camera/picker opens on tap. -->
      <label class="compose-add-photos">
        <!-- Video as well as stills. No `capture` attribute: it forces the camera and
             hides the library, and most memories are already on the phone. -->
        <input id="capture" type="file" accept="image/*,video/*" multiple hidden />
        <span class="compose-add-icon" aria-hidden="true">+</span>
        <span id="composeAddLabel">Add photos or videos</span>
      </label>

      <!-- Said only when it actually happened to something they added. A standing warning
           about a limit most clips never reach is noise; a sentence naming the clip that
           was shortened is information. -->
      <p id="composeClipNote" class="compose-note" hidden></p>

      <label class="compose-field">
        <span class="compose-label">Caption</span>
        <textarea id="composeCaption" rows="3" placeholder="What happened?"></textarea>
      </label>

      <label class="compose-field">
        <span class="compose-label">When did this happen?</span>
        <input id="composeDate" type="date" />
        <!-- Said out loud, because a date field that changes by itself is otherwise
             indistinguishable from one that has gone wrong. -->
        <p id="composeDateNote" class="compose-note" hidden></p>
        <!-- Offered, never applied. When the media disagree there is no right answer to
             pick automatically, but the days themselves are still the best guesses there
             are — so they are put within one tap rather than left in the files. -->
        <div id="composeDatePicks" class="compose-date-picks" hidden></div>
      </label>

      <label class="compose-field">
        <span class="compose-label">Where was this?</span>
        <input id="composeLocation" type="text" maxlength="120"
               placeholder="Somewhere worth remembering" autocomplete="off" />
        <!-- Said out loud for the same reason the date is: a field that fills itself in is
             otherwise indistinguishable from one that has gone wrong. -->
        <p id="composeLocationNote" class="compose-note" hidden></p>
        <!-- Offered, never applied — the same bargain as the dates above. -->
        <div id="composeLocationPicks" class="compose-date-picks" hidden></div>
      </label>

      <label class="compose-toggle">
        <input id="composeMilestone" type="checkbox" />
        <span>Mark as a milestone</span>
      </label>
      <input id="composeMilestoneTitle" class="compose-milestone-title" type="text"
             placeholder="Milestone name, e.g. First steps" hidden />

      <p id="composeError" class="signin-error" role="alert" hidden></p>

      <div class="compose-actions">
        <button id="composeCancel" type="button" class="btn btn--ghost">Cancel</button>
        <button id="composeSave" type="submit" class="btn btn--primary">Save</button>
      </div>

      <!-- Only shown when editing. Deliberately quiet and last. -->
      <button id="composeDelete" type="button" class="compose-delete" hidden>
        Delete this memory
      </button>
    </form>
  </dialog>

  <!-- Reframe one photo. Opened by tapping a thumbnail in the compose sheet.
       The preview is square because the square grid cell is what actually crops. -->
  <dialog id="photoEditor" class="editor" aria-label="Photo framing">
    <div class="editor-body">
      <p class="editor-hint">
        Drag the corners to crop. Tap to set what stays centered.
      </p>

      <!-- One surface: the whole photo, with the crop rectangle and the focal point
           on it together. Drag adjusts the crop; a tap without a drag sets the focus. -->
      <div class="editor-crop">
        <!-- The rotor turns the media without changing the layout box the crop maths
             measures — the same wrapper the cards and the lightbox use. -->
        <div class="rotor editor-rotor">
          <img class="editor-crop-img rotor-media" alt="" />
        </div>
        <div class="editor-rect">
          <span class="editor-handle" data-handle="nw"></span>
          <span class="editor-handle" data-handle="ne"></span>
          <span class="editor-handle" data-handle="sw"></span>
          <span class="editor-handle" data-handle="se"></span>
        </div>
        <span class="editor-dot" aria-hidden="true"></span>
      </div>

      <!-- Trimming is framing, like cropping: the file keeps every frame and these two
           handles say which stretch the memory is. Hidden unless there is a clip. -->
      <div class="editor-trim" hidden>
        <div class="editor-trim-bar">
          <div class="editor-trim-range"></div>
          <span class="editor-trim-handle" data-trim="start"></span>
          <span class="editor-trim-handle" data-trim="end"></span>
        </div>

        <!-- Typing, because dragging cannot reach the precision a long clip needs: a bar
             a few hundred pixels wide puts half a second behind every pixel of a
             three-minute video. inputmode is decimal so a phone offers the right keys. -->
        <div class="editor-trim-fields">
          <label class="editor-trim-field">
            <span>Start</span>
            <input class="editor-trim-time" data-trim-field="start" type="text"
                   inputmode="decimal" autocomplete="off" spellcheck="false" size="7" />
          </label>
          <label class="editor-trim-field">
            <span>End</span>
            <input class="editor-trim-time" data-trim-field="end" type="text"
                   inputmode="decimal" autocomplete="off" spellcheck="false" size="7" />
          </label>
          <button type="button" class="editor-trim-play">Preview</button>
        </div>

        <p class="editor-trim-read"></p>
      </div>

      <!-- Light, held like the crop: numbers applied at render, so a heavy hand costs
           nothing to undo and the file is never touched. Reset appears once something has
           been moved — there is nothing to undo before that. -->
      <div class="editor-light">
        <label class="editor-slider">
          <span class="editor-slider-label">Brightness</span>
          <input class="editor-range" data-light="brightness" type="range"
                 min="0.5" max="1.6" step="0.01" value="1" />
        </label>
        <label class="editor-slider">
          <span class="editor-slider-label">Contrast</span>
          <input class="editor-range" data-light="contrast" type="range"
                 min="0.5" max="1.6" step="0.01" value="1" />
        </label>
        <button type="button" class="editor-light-reset" hidden>Reset</button>
      </div>

      <div class="editor-presets"></div>
      <div class="editor-rotate-bar">
        <button type="button" class="btn btn--ghost editor-rotate" data-turn="-90"
                aria-label="Rotate left">&#8634;</button>
        <button type="button" class="btn btn--ghost editor-rotate" data-turn="90"
                aria-label="Rotate right">&#8635;</button>
      </div>

      <button type="button" class="btn btn--ghost editor-main">Make main photo</button>
      <button type="button" class="btn btn--primary editor-done">Done</button>
    </div>
  </dialog>

  <!-- The full-size photo viewer builds its own markup — see js/lightbox.js -->

  <!-- Sign-in gate. Hidden entirely when the data source has no accounts (mock). -->
  <div id="signin" class="signin" hidden>
    <form id="signinForm" class="signin-card">
      <h2 class="signin-title">Finnbook</h2>
      <p class="signin-hint">Sign in to see and add memories.</p>

      <label class="compose-field">
        <span class="compose-label">Username or email</span>
        <!-- type="text", not "email": the browser would otherwise refuse to submit a
             username as invalid. autocomplete stays "username", which is what it was
             always semantically — the field just used to hold an address. -->
        <input id="signinUsername" type="text" autocomplete="username"
               autocapitalize="none" spellcheck="false" required />
      </label>

      <label class="compose-field">
        <span class="compose-label">Password</span>
        <input id="signinPassword" type="password" autocomplete="current-password" required />
      </label>

      <p id="signinError" class="signin-error" role="alert" hidden></p>

      <button id="signinSubmit" type="submit" class="btn btn--primary">Sign in</button>
    </form>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
