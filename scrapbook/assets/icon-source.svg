<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Finnbook's mark, in the same manner as the gallery's: one flat object on a filled
       ground, drawn only from the app's own palette.

       A DIFFERENT SUBJECT on purpose. The gallery is a framed work on a wall; this is a
       pair of snapshots. Two rectangles-within-rectangles would be one icon at 32px, and
       the whole reason for two apps is that a glance tells them apart.

       Built for the small sizes: shapes carry the picture, not outlines. A 4px stroke
       here is an eighth of a pixel at 32, so the strokes are heavy and the contrast does
       the work — sage on cream, deep sage on baby blue.

       The wall is drawn in, because qlmanage rasterises SVG onto opaque white and a
       transparent source would arrive with nothing left to flatten. -->

  <rect width="512" height="512" fill="#f2f4ec"/>

  <!-- the snapshot behind, tipped the other way -->
  <g transform="rotate(-11 256 258)">
    <rect x="86" y="74" width="286" height="330" rx="14"
          fill="#e6ece2" stroke="#6f8a5c" stroke-width="15"/>
  </g>

  <!-- the snapshot in front -->
  <g transform="rotate(6 256 258)">
    <rect x="132" y="82" width="286" height="330" rx="14"
          fill="#fbfcf9" stroke="#6f8a5c" stroke-width="15"/>
    <!-- the picture within it -->
    <rect x="160" y="110" width="230" height="216" rx="6" fill="#8cc0dc"/>
    <!-- a heart, big enough to survive 32px: warm, and unmistakably not a landscape -->
    <path d="M275 296
             c-58-40-88-70-88-108
             a43 43 0 0 1 78-24
             a43 43 0 0 1 78 24
             c0 38-30 68-88 108 z"
          fill="#6f8a5c" transform="translate(-2 -8)"/>
    <!-- the white margin a snapshot has along its foot -->
    <rect x="160" y="346" width="140" height="20" rx="10" fill="#e6ece2"/>
  </g>
</svg>
