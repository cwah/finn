<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Finn Collection</title>
<meta name="description" content="One drawing at a time, most recent first.">

<!-- Linked individually and in this order, no @import: base sets the tokens every
     later file reads, and frame-styles overrides the chrome variables artwork.css
     declares defaults for. -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/wall.css">
<link rel="stylesheet" href="css/artwork.css">
<link rel="stylesheet" href="css/frame-styles.css">
<link rel="stylesheet" href="css/placard.css">
<link rel="stylesheet" href="css/nav.css">
</head>
<body>

<!-- The wall is its own fixed element rather than a background on <body>, so it can
     be swapped for a photograph by touching one file (css/wall.css) and nothing else. -->
<div class="wall" aria-hidden="true"></div>

<main class="stage" data-swapping="false">

  <div class="gallery">
    <!-- The four boxes are all here from the start and are updated in place; only
         one artwork is ever on the wall, so there is only ever one of each.
         The inline custom properties are the fallback ratio, replaced by render.js
         from the manifest before the image loads — which is what stops the frame
         popping from one shape to another as the file arrives. -->
    <figure class="artwork" data-frame="plain" data-mat="paper" style="--art-w: 4; --art-h: 5">
      <div class="frame">
        <div class="mat">
          <div class="window">
            <img class="art" alt="" decoding="async">
          </div>
        </div>
        <span class="glass" aria-hidden="true"></span>
      </div>
    </figure>

    <button class="nav" type="button" data-nav="older" aria-label="Earlier work">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 5 L8 12 L15 19"/>
      </svg>
    </button>
    <button class="nav" type="button" data-nav="newer" aria-label="Later work">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 5 L16 12 L9 19"/>
      </svg>
    </button>
  </div>

  <!-- Filled by render.js. Every line is optional and simply absent when unknown. -->
  <section class="placard" aria-label="About this artwork"></section>
</main>

<!-- The gallery is private. This is the only interface the wall ever grows, it is only
     ever shown instead of the wall, and it is deliberately the same plate the placard
     is made of — a label on an otherwise empty wall. Signing in here signs you in to
     the scrapbook too; see js/session.js. -->
<section class="gate" hidden>
  <form class="gate-form" autocomplete="on">
    <h1 class="gate-title" data-el="gate-title">The Finn Collection</h1>
    <p class="gate-sub">Sign in to see the collection.</p>
    <label class="gate-field">
      <span>Username or email</span>
      <input name="identity" type="text" autocomplete="username" required>
    </label>
    <label class="gate-field">
      <span>Password</span>
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Sign in</button>
    <p class="gate-error" role="alert" hidden></p>
  </form>
</section>

<!-- Just the position and the title. An aria-live region around the whole placard
     would re-read the entire note on every arrow press. -->
<p class="sr-only" role="status" aria-live="polite"></p>

<script type="module" src="js/app.js"></script>
</body>
</html>
