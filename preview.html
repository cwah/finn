<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f4ec" />
  <title>Scrapbook — layout preview</title>

  <!-- Visual test bench: every layout and treatment on one page, rendered through the
       real engine and the real stylesheets. It used to inline a copy of the CSS and
       hand-write the card markup, which drifted the moment either changed. Serve it
       the same way as the app (e.g. python3 -m http.server) — ES modules need HTTP. -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/cards.css" />
  <link rel="stylesheet" href="css/lightbox.css" />
  <style>
    .preview-banner {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 16px 8px;
      color: var(--text-dim);
      font-size: 0.78rem;
      text-align: center;
    }
    .preview-label {
      max-width: var(--maxw);
      margin: 18px auto -14px;
      padding: 0 16px;
      color: var(--accent-ink);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    /* Nothing scrolls into view here — show every item immediately. */
    .timeline-item { opacity: 1; transform: none; }
    .preview-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      padding: 20px 8px;
    }
    .preview-art {
      margin: 0;
      display: grid;
      justify-items: center;
      gap: 6px;
      color: var(--accent-ink);
    }
    .preview-art svg { width: 100%; height: auto; }
    .preview-art figcaption {
      color: var(--text-dim);
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">Baby Wah</h1>
    <p class="app-subtitle">Layout preview</p>
  </header>

  <p class="preview-banner">Every layout rule and treatment, rendered by the live engine.</p>

  <main id="timeline" class="timeline" aria-label="Layout samples"></main>

  <script type="module">
    import { renderPost } from './js/render.js';
    import { inferLayout } from './js/layout-engine.js';
    import { ART_PRESETS, milestoneArtSvg } from './js/milestone-art.js';
    import { initCarousels } from './js/carousel.js';
    import { initLightbox } from './js/lightbox.js';

    const BIRTH = '2026-03-17';
    const timeline = document.getElementById('timeline');

    const photo = (seed, width, height) => ({
      id: seed,
      url: `https://picsum.photos/seed/${seed}/${width}/${height}`,
      width,
      height,
      alt: '',
    });

    const post = (fields) => ({
      id: Math.random().toString(36).slice(2),
      createdAt: '2026-07-24T12:00:00Z',
      author: { id: 'u1', name: 'Mom' },
      caption: null,
      milestone: null,
      photos: [],
      ...fields,
    });

    // One sample per rule in the engine, plus the milestone treatment on top of each.
    const samples = [
      ['Rule 1 · quote', post({
        memoryDate: '2026-07-24',
        caption: 'Every yawn, every coo — pure magic.',
      })],
      ['Rule 2 · portrait', post({
        memoryDate: '2026-07-20',
        caption: 'Tiny yawns.',
        photos: [photo('yawn', 900, 1200)],
        author: { id: 'u2', name: 'Dad' },
      })],
      ['Rule 3 · landscape', post({
        memoryDate: '2026-07-12',
        caption: 'Sunny afternoon at the park.',
        photos: [photo('parkday', 1200, 800)],
      })],
      ['Rule 3 · landscape (square photo)', post({
        memoryDate: '2026-07-10',
        caption: 'A square photo is landscape — the rule is width >= height.',
        photos: [photo('square', 800, 800)],
        author: { id: 'u2', name: 'Dad' },
      })],
      ['Rule 4 · grid of 2', post({
        memoryDate: '2026-07-08',
        photos: [photo('two1', 800, 800), photo('two2', 800, 800)],
      })],
      ['Rule 4 · grid of 3', post({
        memoryDate: '2026-07-07',
        caption: 'Three at a time — the first spans the full width.',
        photos: [photo('three1', 800, 800), photo('three2', 800, 800), photo('three3', 800, 800)],
        author: { id: 'u2', name: 'Dad' },
      })],
      ['Rule 4 · grid of 4', post({
        memoryDate: '2026-07-06',
        caption: 'Sunday morning at the park.',
        photos: [1, 2, 3, 4].map((n) => photo(`sun${n}`, 800, 800)),
      })],
      ['Rule 5 · carousel (more than four)', post({
        memoryDate: '2026-07-05',
        caption: 'Six from one afternoon — swipe through.',
        photos: [1, 2, 3, 4, 5, 6].map((n) => photo(`carousel${n}`, 1200, 900)),
      })],
      ['Rule 5 · carousel, mixed orientations', post({
        memoryDate: '2026-07-05',
        photos: [
          photo('mix1', 1200, 800),   // landscape
          photo('mix2', 900, 1200),   // portrait
          photo('mix3', 800, 800),    // square
          photo('mix4', 1200, 900),   // landscape
          photo('mix5', 1000, 1400),  // tall portrait
        ],
        author: { id: 'u2', name: 'Dad' },
      })],
      ['Crop · wide photo cropped tall becomes a PORTRAIT card', post({
        memoryDate: '2026-07-03',
        caption: 'Cropping changes what the engine sees.',
        photos: [{ ...photo('cropme', 1600, 900), crop: { x: 0.35, y: 0, w: 0.25, h: 1 } }],
      })],
      ['Crop · lead photo cropped tall reshapes the 3-grid hero', post({
        memoryDate: '2026-07-01',
        caption: 'The hero follows the lead photo, not a fixed square.',
        photos: [
          { ...photo('hero', 1600, 900), crop: { x: 0.3, y: 0, w: 0.4, h: 1 } },
          photo('heroB', 800, 800),
          photo('heroC', 800, 800),
        ],
      })],
      ['Crop · same photo, four crops in a grid', post({
        memoryDate: '2026-07-02',
        photos: [
          { ...photo('cropme', 1600, 900), crop: { x: 0, y: 0, w: 0.25, h: 1 } },
          { ...photo('cropme', 1600, 900), crop: { x: 0.375, y: 0.25, w: 0.25, h: 0.5 } },
          { ...photo('cropme', 1600, 900), crop: { x: 0.75, y: 0, w: 0.25, h: 1 } },
          { ...photo('cropme', 1600, 900) },
        ],
        author: { id: 'u2', name: 'Dad' },
      })],
      ['Focal point · same photo, framed three ways', post({
        memoryDate: '2026-07-04',
        caption: 'Smart crop keeps the subject in the square cell.',
        photos: [
          { ...photo('focal', 1200, 900), focalX: 0.15, focalY: 0.5 },
          { ...photo('focal', 1200, 900), focalX: 0.5, focalY: 0.5 },
          { ...photo('focal', 1200, 900), focalX: 0.85, focalY: 0.5 },
        ],
        author: { id: 'u2', name: 'Dad' },
      })],
      ['Milestone · real artwork (dino.png, masked to the palette)', post({
        memoryDate: '2026-06-28',
        caption: 'Titles hashing to the dinosaur preset use the real PNG.',
        milestone: { isMilestone: true, title: 'Hello world!' },
        photos: [photo('dinocard', 1200, 900)],
      })],
      ['Rule 5 · milestone + portrait', post({
        memoryDate: '2026-06-30',
        caption: 'She did it — three wobbly steps to the couch.',
        milestone: { isMilestone: true, title: 'First steps' },
        photos: [photo('steps', 900, 1200)],
        author: { id: 'u2', name: 'Dad' },
      })],
      ['Rule 5 · milestone + grid', post({
        memoryDate: '2026-06-01',
        caption: 'That first real giggle. We melted.',
        milestone: { isMilestone: true, title: 'First laugh' },
        photos: [1, 2, 3].map((n) => photo(`laugh${n}`, 800, 800)),
      })],
      ['Rule 5 · milestone + quote', post({
        memoryDate: '2026-03-17',
        caption: 'Welcome to the world, little one.',
        milestone: { isMilestone: true, title: 'Day one' },
      })],
      ['No photos, no caption · renders nothing', post({ memoryDate: '2026-03-22' })],
    ];

    for (const [label, sample] of samples) {
      const heading = document.createElement('p');
      heading.className = 'preview-label';
      heading.textContent = `${label} → ${inferLayout(sample) ?? 'null'}`;
      timeline.append(heading);

      const card = renderPost(sample, BIRTH);
      if (card) timeline.append(card);
    }

    initCarousels(timeline);
    initLightbox(timeline);

    // app.js normally assigns the alternating sides and fades the artwork with scroll;
    // this bench shows everything at once, so pin both up front.
    timeline.querySelectorAll('.milestone-scene').forEach((scene, i) => {
      scene.classList.add(i % 2 === 0 ? 'side-right' : 'side-left');
      scene.style.setProperty('--art-progress', 1);
    });

    // Every stock drawing, so a new preset can be eyeballed without hunting for a
    // title that happens to hash onto it.
    const gallery = document.createElement('div');
    gallery.className = 'preview-gallery';
    for (const preset of ART_PRESETS) {
      const cell = document.createElement('figure');
      cell.className = 'preview-art';
      cell.innerHTML = `${milestoneArtSvg(preset)}<figcaption>${preset}</figcaption>`;
      gallery.append(cell);
    }
    const galleryLabel = document.createElement('p');
    galleryLabel.className = 'preview-label';
    galleryLabel.textContent = 'Milestone sketches · all presets';
    timeline.append(galleryLabel, gallery);
  </script>
</body>
</html>
